<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100">
    <div class="flex h-screen">
        <div class="w-1/2 flex items-center justify-center p-8">
            <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-sm">
                <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Digite seu nome</h1>

                <input type="text" id="txt-nome" placeholder="Digite seu nome" class="border border-gray-300 rounded px-4 py-2 mb-4 w-full focus:outline-none focus:ring-2 focus:ring-blue-500">

                <p id="msg-erro" class="text-red-600 font-bold text-sm mb-4"></p>

                <button id="btn-validar" onclick="validarNome()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">Validar</button>
            </div>
        </div>
    
        <div class="w-1/2 flex items-center justify-center p-8">
            <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-sm h-96 overflow-y-auto">
                <h2 class="text-2xl font-bold text-gray-800 mb-4 text-center">Nomes Adicionados</h2>
                <div id="container-nomes"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
